name: Moodle Plugin CI
run-name: "Moodle Plugin CI [${{ github.ref_type }}:${{ github.ref_name }}]"

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quicklinks-native-candidate:
    # Draft visibility requires push permission. Isolate that token here:
    # this job never executes plugin code, npm scripts or candidate tools.
    if: github.event.repository.name == 'moodle-block_aiplugin_nav'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: .github/quicklinks-native-install
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Acquire original staged archive without publishing the draft
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ASSET_PREFIX: https://api.github.com/repos/${{ github.repository }}/releases/assets/
        run: |
          set -euo pipefail
          url="$(cat candidate-asset-url.txt)"
          # Never send the token to a candidate-controlled host or other repo.
          asset="${url#"$EXPECTED_ASSET_PREFIX"}"
          test "$url" != "$asset"
          [[ "$asset" =~ ^[1-9][0-9]*$ ]]
          # GitHub's asset API redirects to signed blob storage; curl does NOT
          # forward Authorization across hosts (do not use --location-trusted).
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            "$url" --output candidate.zip
      - name: Verify original staged archive before dependency preparation
        run: |
          set -euo pipefail
          test "$(wc -l < candidate.sha256)" = 1
          grep -Ex '[a-f0-9]{64}' candidate.sha256
          printf '%s  candidate.zip\n' "$(cat candidate.sha256)" | sha256sum --check --strict
      - name: Pass verified original bytes to the unprivileged acceptance job
        uses: actions/upload-artifact@v4
        with:
          name: quicklinks-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/quicklinks-native-install/candidate.zip
          if-no-files-found: error
          retention-days: 14

  quicklinks-native-install:
    # Same workflow conclusion consumed by the existing immutable-tag release gate.
    # No write credential reaches the code which installs or executes the plugin.
    needs: quicklinks-native-candidate
    if: github.event.repository.name == 'moodle-block_aiplugin_nav'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
        working-directory: .github/quicklinks-native-install
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: quicklinks-native-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github/quicklinks-native-install
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pgsql, pdo_pgsql, gd, intl, mbstring, curl, zip, soap, sodium, exif
          ini-values: max_input_vars=5000
          tools: composer
          coverage: none
      - name: Recheck transported candidate against the independently committed SHA
        run: |
          set -euo pipefail
          test "$(wc -l < candidate.sha256)" = 1
          grep -Ex '[a-f0-9]{64}' candidate.sha256
          printf '%s  candidate.zip\n' "$(cat candidate.sha256)" | sha256sum --check --strict
      - name: Prepare disposable Moodle 4.5 dependencies and PostgreSQL 16 binaries
        run: |
          set -euo pipefail
          mkdir -p generated-artifacts/ci-evidence
          # This is a binary install, not a shared database service. The harness
          # creates/stops its own socket-only cluster as the unprivileged runner.
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          npm ci --ignore-scripts --no-audit --no-fund
          git clone --depth=1 --branch MOODLE_405_STABLE https://github.com/moodle/moodle.git generated-artifacts/moodle-source
          git -C generated-artifacts/moodle-source rev-parse HEAD > generated-artifacts/ci-evidence/moodle-commit.txt
          cp generated-artifacts/moodle-source/composer.lock generated-artifacts/ci-evidence/moodle-composer.lock
          composer install --working-dir=generated-artifacts/moodle-source --no-interaction --prefer-dist 2>&1 | tee generated-artifacts/ci-evidence/composer.log
          test -f generated-artifacts/moodle-source/vendor/autoload.php
      - name: Required native acceptance of exact candidate ZIP
        run: |
          set -euo pipefail
          npm run test:quicklinks-native-install -- \
            --moodle-source="$PWD/generated-artifacts/moodle-source" \
            --zip="$PWD/candidate.zip" \
            --sha256="$(cat candidate.sha256)" \
            --pg-bin=/usr/lib/postgresql/16/bin \
            2>&1 | tee generated-artifacts/ci-evidence/native-install.log
      - name: Preserve reports and logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quicklinks-native-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/quicklinks-native-install/candidate.sha256
            .github/quicklinks-native-install/candidate-asset-url.txt
            .github/quicklinks-native-install/candidate.zip
            .github/quicklinks-native-install/generated-artifacts/ci-evidence/
            .github/quicklinks-native-install/generated-artifacts/quicklinks-native-install/run-*/report.json
            .github/quicklinks-native-install/generated-artifacts/quicklinks-native-install/run-*/inventory.json
            .github/quicklinks-native-install/generated-artifacts/quicklinks-native-install/run-*/*.log
          retention-days: 14
          if-no-files-found: error
      - name: Remove disposable Moodle code and database files
        if: always()
        run: rm -rf generated-artifacts

  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Lowest and highest PHP supported by each branch. The middle versions
        # cost minutes without telling you anything the boundaries do not.
        # Each branch runs its own lowest and highest supported PHP, taken from
        # moodledev.io: 4.4 and 4.5 are PHP 8.1-8.3, 5.0 and 5.1 are 8.2-8.4,
        # 5.2 raised the minimum to 8.3. The middle versions cost minutes
        # without telling you anything the boundaries do not.
        include:
          - {php: '8.1', moodle-branch: 'MOODLE_404_STABLE', database: pgsql}
          - {php: '8.1', moodle-branch: 'MOODLE_404_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_404_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_404_STABLE', database: mariadb}
          - {php: '8.1', moodle-branch: 'MOODLE_405_STABLE', database: pgsql}
          - {php: '8.1', moodle-branch: 'MOODLE_405_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_405_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_405_STABLE', database: mariadb}
          - {php: '8.2', moodle-branch: 'MOODLE_500_STABLE', database: pgsql}
          - {php: '8.2', moodle-branch: 'MOODLE_500_STABLE', database: mariadb}
          - {php: '8.4', moodle-branch: 'MOODLE_500_STABLE', database: pgsql}
          - {php: '8.4', moodle-branch: 'MOODLE_500_STABLE', database: mariadb}
          - {php: '8.2', moodle-branch: 'MOODLE_501_STABLE', database: pgsql}
          - {php: '8.2', moodle-branch: 'MOODLE_501_STABLE', database: mariadb}
          - {php: '8.4', moodle-branch: 'MOODLE_501_STABLE', database: pgsql}
          - {php: '8.4', moodle-branch: 'MOODLE_501_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_502_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_502_STABLE', database: mariadb}
          - {php: '8.4', moodle-branch: 'MOODLE_502_STABLE', database: pgsql}
          - {php: '8.4', moodle-branch: 'MOODLE_502_STABLE', database: mariadb}
          # Moodle 5.3 development is main; retain PostgreSQL 17 / MariaDB 11.4.
          - {php: '8.3', moodle-branch: 'main', database: pgsql}
          - {php: '8.3', moodle-branch: 'main', database: mariadb}
          - {php: '8.4', moodle-branch: 'main', database: pgsql}
          - {php: '8.4', moodle-branch: 'main', database: mariadb}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          # Behat --scss-deprecations requires moodle-plugin-ci 4.5.7 or newer.
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5.7
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ always() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ always() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # moodle-plugin-ci backs the plugin up, runs Grunt, compares sha1 hashes,
      # and then RESTORES the backup - so by the time any later step runs, its
      # Grunt output is already gone. Re-run Moodle's own Grunt directly to
      # produce the real artefacts, then publish those. Works for any plugin:
      # the install path is found by looking for the version.php in the Moodle
      # tree that declares this plugin's component.
      - name: Rebuild AMD with Moodle's Grunt
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          echo "AMD_BUILD_PATH=moodle/.no-amd-build" >> "$GITHUB_ENV"
          COMPONENT=$(sed -n "s/.*\$plugin->component *= *'\([^']*\)'.*/\1/p" plugin/version.php | head -1)
          if [ -z "$COMPONENT" ]; then echo "No component in plugin/version.php"; exit 0; fi
          PLUGIN_PATH=$(cd moodle && find . -name version.php -not -path "./node_modules/*" \
            -exec grep -l "component *= *'$COMPONENT'" {} \; 2>/dev/null | head -1 | xargs -r dirname)
          if [ -z "$PLUGIN_PATH" ] || [ ! -d "moodle/$PLUGIN_PATH/amd" ]; then
            echo "No amd directory for $COMPONENT"; exit 0
          fi
          ( cd "moodle/$PLUGIN_PATH/amd" && "$GITHUB_WORKSPACE/moodle/node_modules/.bin/grunt" amd ) || true
          echo "AMD_BUILD_PATH=moodle/$PLUGIN_PATH/amd/build" >> "$GITHUB_ENV"

      - name: Upload Grunt output
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: grunt-build-${{ matrix.php }}-${{ matrix.moodle-branch }}-${{ matrix.database }}
          path: ${{ env.AMD_BUILD_PATH }}
          if-no-files-found: ignore

      - name: PHPUnit tests
        if: ${{ always() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ always() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
