name: Moodle Plugin CI
run-name: "Moodle Plugin CI [${{ github.ref_type }}:${{ github.ref_name }}]"

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # Lowest and highest PHP supported by each branch. The middle versions
        # cost minutes without telling you anything the boundaries do not.
        # Each branch runs its own lowest and highest supported PHP, taken from
        # moodledev.io: 4.4 and 4.5 are PHP 8.1-8.3, 5.0 and 5.1 are 8.2-8.4,
        # 5.2 raised the minimum to 8.3. The middle versions cost minutes
        # without telling you anything the boundaries do not.
        include:
          - {php: '8.1', moodle-branch: 'MOODLE_404_STABLE', database: pgsql}
          - {php: '8.1', moodle-branch: 'MOODLE_404_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_404_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_404_STABLE', database: mariadb}
          - {php: '8.1', moodle-branch: 'MOODLE_405_STABLE', database: pgsql}
          - {php: '8.1', moodle-branch: 'MOODLE_405_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_405_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_405_STABLE', database: mariadb}
          - {php: '8.2', moodle-branch: 'MOODLE_500_STABLE', database: pgsql}
          - {php: '8.2', moodle-branch: 'MOODLE_500_STABLE', database: mariadb}
          - {php: '8.4', moodle-branch: 'MOODLE_500_STABLE', database: pgsql}
          - {php: '8.4', moodle-branch: 'MOODLE_500_STABLE', database: mariadb}
          - {php: '8.2', moodle-branch: 'MOODLE_501_STABLE', database: pgsql}
          - {php: '8.2', moodle-branch: 'MOODLE_501_STABLE', database: mariadb}
          - {php: '8.4', moodle-branch: 'MOODLE_501_STABLE', database: pgsql}
          - {php: '8.4', moodle-branch: 'MOODLE_501_STABLE', database: mariadb}
          - {php: '8.3', moodle-branch: 'MOODLE_502_STABLE', database: pgsql}
          - {php: '8.3', moodle-branch: 'MOODLE_502_STABLE', database: mariadb}
          - {php: '8.4', moodle-branch: 'MOODLE_502_STABLE', database: pgsql}
          - {php: '8.4', moodle-branch: 'MOODLE_502_STABLE', database: mariadb}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ always() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ always() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # moodle-plugin-ci backs the plugin up, runs Grunt, compares sha1 hashes,
      # and then RESTORES the backup - so by the time any later step runs, its
      # Grunt output is already gone. Re-run Moodle's own Grunt directly to
      # produce the real artefacts, then publish those.
      - name: Rebuild AMD with Moodle's Grunt
        if: ${{ failure() }}
        run: |
          cd moodle/payment/gateway/paddle/amd
          "$GITHUB_WORKSPACE/moodle/node_modules/.bin/grunt" amd || true
      - name: Upload Grunt output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: grunt-build-${{ matrix.php }}-${{ matrix.moodle-branch }}-${{ matrix.database }}
          path: moodle/payment/gateway/paddle/amd/build
          if-no-files-found: ignore

      - name: PHPUnit tests
        if: ${{ always() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        if: ${{ always() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
